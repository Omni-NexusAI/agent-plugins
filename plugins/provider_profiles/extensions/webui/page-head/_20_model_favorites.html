<script>
  (() => {
    const VERSION = "1.1.0";
    // Plugin base path from this component's own location; the fixed path is the fallback.
    let base = "/plugins/provider_profiles";
    try {
      const path = document.currentScript?.closest?.("x-component")?.getAttribute("path") || "";
      const match = path.match(/^(.*\/plugins\/[^/]+)\/extensions\//);
      if (match) base = match[1];
    } catch { /* keep fallback */ }

    if (!document.querySelector('link[data-pp-favorites-css]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `${base}/webui/favorites.css?v=${VERSION}`;
      link.dataset.ppFavoritesCss = "1";
      document.head.appendChild(link);
    }
    import(`${base}/webui/favorites-ui.js?v=${VERSION}`)
      .then((module) => module.install())
      .catch((error) => console.warn("Provider Profiles: favorites unavailable", error));
  })();
</script>
