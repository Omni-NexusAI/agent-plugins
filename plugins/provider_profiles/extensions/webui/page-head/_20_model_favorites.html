<script>
  (() => {
    const VERSION = "1.2.0";
    // Plugin base path from this component's own location; the fixed path is the fallback.
    let base = "/plugins/provider_profiles";
    try {
      const path = document.currentScript?.closest?.("x-component")?.getAttribute("path") || "";
      const match = path.match(/^(.*\/plugins\/[^/]+)\/extensions\//);
      if (match) base = match[1];
    } catch { /* keep fallback */ }

    if (!document.querySelector('link[data-pp-favorites-css]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `${base}/webui/favorites.css?v=${VERSION}`;
      link.dataset.ppFavoritesCss = "1";
      document.head.appendChild(link);
    }
    const v = `?v=${VERSION}`;
    const load = (name) => import(`${base}/webui/${name}.js${v}`);
    // Discovery is optional: if any of its modules fails to load, favorites still install without it.
    const optional = Promise.allSettled([load("discovery-ui"), load("discovery-merge"), load("discovery-api")]);
    Promise.all([load("favorites-ui"), load("favorites-core"), load("favorites-api"), load("store-patch"), optional])
      .then(([ui, core, api, patch, loaded]) => {
        const [discoveryUi, merge, discoveryApi] = loaded.map((result) => (result.status === "fulfilled" ? result.value : null));
        const discovery = discoveryUi && merge && discoveryApi ? { ui: discoveryUi, merge, api: discoveryApi } : null;
        return ui.install({ core, api, installStorePatch: patch.installStorePatch, discovery });
      })
      .catch((error) => console.warn("Provider Profiles: model field enhancements unavailable", error));
  })();
</script>
