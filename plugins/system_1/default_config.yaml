decider:
  backend: jev
  provider: jev
  model: jev-latest
  endpoint: https://api.typesafe.ai/v1/systemone
  token_env: SYSTEM_1_JEV_API_KEY
  context_window: 8192
main:
  enabled: false
utility:
  enabled: false
  fixed_routes: []
embedding:
  enabled: false
policy:
  preset: balanced
  min_choice_probability: 0.85
  timeout_seconds: 2.0
  max_state_chars: 4000
  max_actions_per_turn: 3
  max_result_chars: 2000
  monitor_interval_seconds: 0.5
  monitor_max_checks: 20
  monitor_max_seconds: 30
  action_precedence: main_first
  actions: {}
