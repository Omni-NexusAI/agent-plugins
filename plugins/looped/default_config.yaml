# Mirrors core/config.py DEFAULTS (a test keeps the two identical).
mode: manual                  # off | manual | auto | always
apply_to_subordinates: false
execution: auto               # auto | sequential | parallel
show_steps: all               # all | changed | none
budget:
  max_extra_calls_per_step: 1
  allow_tiebreak: true
  max_extra_calls_per_turn: 8
sampling:
  temperature: 0.7
  seed_base: 1000
strategies:
  reread:
    enabled: true
    when: non_thinking        # non_thinking | always | never
    max_chars: 4000
  agree:
    enabled: true
  fuse:
    enabled: true
    min_chars: 400
  retry:
    enabled: true
    max_per_turn: 2
  deepen:
    enabled: false
  escalate:
    enabled: false
    carry: false
    reasoning_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
  plan_branch:
    enabled: false
    branches: 2
    max_chars: 2000
auto:
  checkpoints:
    - first_step
    - risky_tool
    - final_response
    - after_error
    - invalid_step
  risky_tools:
    - code_execution_tool
    - input
    - text_editor
    - memory_save
    - memory_delete
    - memory_forget
    - behaviour_adjustment
    - call_subordinate
    - scheduler
    - browser_agent
    - browser
    - a2a_chat
    - notify_user
    - parallel
    - "*.*"
